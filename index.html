<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám Phá Du Lịch Sóc Trăng</title>
    
    <!-- MÃ CSS ĐƯỢC GỘP CHUNG VÀO ĐÂY -->
    <style>
        /* ==========================================
           1. CHẾ ĐỘ VIEW DI ĐỘNG (Mobile First - Mặc định)
           Sử dụng Grid 1 cột, khoảng cách 10px giữa các phần tử
           ========================================== */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        figure img {
            width: 100%;
            height: auto;
            display: block;
        }

        figure {
            margin: 0;
            padding: 10px;
            background-color: #f4f4f4;
            border: 1px solid #ccc;
        }

        /* ==========================================
           TÍNH NĂNG 1: Tablet View (>= 772px)
           Lưới 2 cột, hình ảnh bo tròn, phần tử cuối trải rộng 2 cột
           ========================================== */
        @media screen and (min-width: 772px) {
            .grid-container {
                grid-template-columns: 1fr 1fr;
            }

            figure {
                border-radius: 50%;
                overflow: hidden;
            }

            figure:last-child {
                grid-column: span 2;
            }
        }

        /* ==========================================
           TÍNH NĂNG 2: Màn hình máy tính lớn (>= 992px)
           Lưới 3 cột, mỗi phần tử thứ 3 (3n) chiếm 2 cột
           ========================================== */
        @media screen and (min-width: 992px) {
            figure:last-child {
                grid-column: auto;
            }

            figure:nth-child(3n) {
                grid-column: span 2;
            }

            figure {
                border-radius: 0;
            }
        }

        /* ==========================================
           TÍNH NĂNG 3: Hỗ trợ giảm chuyển động (Prefers Reduced Motion)
           ========================================== */
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto !important;
            }

            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }

        /* ==========================================
           TÍNH NĂNG 4: Hỗ trợ Chế độ tối (Prefers Dark Scheme)
           Nền tối #222222, chữ sáng #ffff80 đạt chuẩn tương phản WAVE
           ========================================== */
        @media (prefers-color-scheme: dark) {
            figure {
                background-color: #222222;
                color: #ffff80;
                border: 2px solid #000000;
            }
        }
    </style>
</head>
